[pytest]
testpaths = tests
# asyncio_mode=auto so an `async def test_...` runs without each one
# needing an explicit @pytest.mark.asyncio decorator.
asyncio_mode = auto
# `repo` marks a test that asserts a property of the REPOSITORY or of a
# deployment artefact (the Dockerfile, the compose file, the Caddyfile,
# the workflows, .gitignore) rather than of the running application.
#
# The distinction is load-bearing for R4: the suite is run inside the
# runtime-adjacent test image, and those files are deliberately NOT in
# the image -- the runtime stage copies only app/ and alembic/. Without
# the marker, 47 tests fail with FileNotFoundError inside the image and
# drown the signal from the application tests.
#
#   in the image:  python -m pytest -m "not repo"
#   on a checkout: python -m pytest -m repo
markers =
    repo: asserts a property of the repository or a deployment artefact, not of the running app
asyncio_default_fixture_loop_scope = function
filterwarnings =
    # Third-party deprecations under Python 3.14 that we do not control
    # (starlette/fastapi calling asyncio.iscoroutinefunction).
    ignore::DeprecationWarning:starlette.*
    ignore::DeprecationWarning:fastapi.*
    ignore::PendingDeprecationWarning
