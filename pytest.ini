[pytest]
testpaths = tests
# asyncio_mode=auto so an `async def test_...` runs without each one
# needing an explicit @pytest.mark.asyncio decorator.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    # Third-party deprecations under Python 3.14 that we do not control
    # (starlette/fastapi calling asyncio.iscoroutinefunction).
    ignore::DeprecationWarning:starlette.*
    ignore::DeprecationWarning:fastapi.*
    ignore::PendingDeprecationWarning
