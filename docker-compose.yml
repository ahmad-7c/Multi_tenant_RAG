services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: documind
      POSTGRES_PASSWORD: documind
      POSTGRES_DB: documind
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documind"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    # Bind-mounted (not a named volume) so the host directory is the same
    # one the worker mounts below -- the API writes uploaded files here,
    # the worker reads them back by file_path during ingestion.
    volumes:
      - ./uploads:/code/uploads

  worker:
    build: .
    env_file: .env
    # Same image as api, different entrypoint: a Celery worker instead of
    # uvicorn, so it has access to the exact same app.models/app.workers
    # code the task was defined with.
    command: celery -A app.workers.celery_app worker --loglevel=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./uploads:/code/uploads

volumes:
  db_data:
